; MPUMID.INI - configuracion de MPUMID
; directorio raiz del explorador (sin argumentos arranca ahi)
PATH=C:\MIDI

; color del cuerpo del SC-55 y del LCD. Dos formas:
;   un numero 0..15 de la paleta estandar (3 = cian, 8 = gris oscuro...)
;   o R,G,B exacto, 0..255 cada uno
; sin estas lineas quedan los colores de siempre
; colores del SC-55 original (cuerpo gris y LCD ambar)
SC55COLOR=80,79,75
LCDCOLOR=255,197,12
; LED de POWER (por defecto verde, no cambia con el LCD)
;LEDCOLOR=0,255,0

; efecto de fondo: NONE (nada), STARS (estrellas con scroll) o SNOW (nieve)
EFFECT=STARS

; puerto de la MPU-401 (hex). Si no esta, se usa el P= de BLASTER o 330
;MPUPORT=330
